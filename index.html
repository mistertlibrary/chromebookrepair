<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromebook Repair Center</title>
<style>

@font-face {
  font-family: 'Fredoka';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url(assets/99d6c78e0437.woff2) format('woff2');
}
@font-face {
  font-family: 'Comic Neue';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(assets/b7753f30f8bd.woff2) format('woff2');
}
@font-face {
  font-family: 'Comic Neue';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url(assets/13e9f12e3a02.woff2) format('woff2');
}

:root {
  --crc-pink: #ff2e9a;
  --crc-magenta: #e8128c;
  --crc-purple: #8b2fc9;
  --crc-violet: #6a2ff7;
  --crc-cyan: #16cfe0;
  --crc-yellow: #ffd23f;
  --crc-lime: #57e389;
  --crc-orange: #ff7a3d;
  --crc-ink: #2a1233;
  --crc-paper: #ffffff;
  --crc-heading: #c2186a;
  --crc-line: #f3c6e6;
  --crc-error: #c0185c;
  --crc-link: #aa1560;
  --crc-label: #6a1a86;
  --crc-display: 'Fredoka', 'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --crc-body: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
}

.crc-app {
  position: relative;
  overflow-x: hidden;
  background-color: #fff;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,46,154,0.10) 0 12px, transparent 13px),
    radial-gradient(circle at 82% 12%, rgba(22,207,224,0.12) 0 10px, transparent 11px),
    radial-gradient(circle at 26% 78%, rgba(255,210,63,0.16) 0 9px, transparent 10px),
    radial-gradient(circle at 70% 84%, rgba(139,47,201,0.10) 0 12px, transparent 13px),
    linear-gradient(160deg, #fff0fb 0%, #f1f7ff 45%, #fff6ec 100%);
  color: var(--crc-ink);
  font-family: var(--crc-body);
  font-size: 15px;
  line-height: 1.6;
  margin: 0;
  padding: 0;
  min-height: 100vh;
}

.crc-app *,
.crc-app *::before,
.crc-app *::after { box-sizing: border-box; }

.crc-app h1,
.crc-app h2,
.crc-app h3 {
  font-family: var(--crc-display);
  font-weight: 700;
  color: var(--crc-heading);
  margin: 0 0 0.5em;
  text-align: center;
  letter-spacing: 0.3px;
}
.crc-app a {
  color: var(--crc-link);
  border-radius: 3px;
  text-decoration: none;
  font-weight: 700;
  transition: color 0.2s ease-in-out;
}
.crc-app a:hover { color: var(--crc-violet); text-decoration: underline; }
.crc-app a:focus-visible { outline: 3px solid var(--crc-violet); outline-offset: 2px; }

/* ---- Accents layer ------------------------------------------ */
.crc-accents {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 40;
}
.crc-acc { position: absolute; display: block; }
.crc-acc--float { animation: crc-float 6s ease-in-out infinite; }
.crc-acc--bob   { animation: crc-bob 5s ease-in-out infinite; }
.crc-acc--twinkle { animation: crc-twinkle 3.2s ease-in-out infinite; }
.crc-acc--spin  { animation: crc-spin 14s linear infinite; }

@keyframes crc-float {
  0%,100% { transform: translateY(0) rotate(-4deg); }
  50%     { transform: translateY(-16px) rotate(4deg); }
}
@keyframes crc-bob {
  0%,100% { transform: translateY(0) rotate(6deg); }
  50%     { transform: translateY(12px) rotate(-6deg); }
}
@keyframes crc-twinkle {
  0%,100% { opacity: 0.35; transform: scale(0.85); }
  50%     { opacity: 1; transform: scale(1.15); }
}
@keyframes crc-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .crc-acc--float, .crc-acc--bob, .crc-acc--twinkle, .crc-acc--spin {
    animation: none;
  }
}

/* ---- Banner ------------------------------------------------- */
.crc-banner { position: relative; z-index: 1; line-height: 0; }
.crc-banner-img {
  display: block;
  width: 100%;
  height: auto;
  border-bottom: 6px solid transparent;
  border-image: linear-gradient(90deg, var(--crc-violet), var(--crc-cyan), var(--crc-lime)) 1;
}
.crc-titlebar {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 1rem;
  background:
    linear-gradient(90deg,
      #e0589f, #e08f5c, #e0c25c,
      #7fc99a, #5cb7c2, #8868d6);
  border-bottom: 6px solid transparent;
  border-image: linear-gradient(90deg, var(--crc-violet), var(--crc-pink)) 1;
}
.crc-titlebar h1 {
  display: inline-block;
  color: #fff;
  font-size: 2rem;
  margin: 0;
  padding: 0.35rem 1.1rem;
  background: rgba(42,18,51,0.72);
  border-radius: 14px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
}

/* ---- Layout ------------------------------------------------- */
.crc-main { position: relative; z-index: 1; max-width: 880px; margin: 1.75rem auto; padding: 0 1rem; }

.crc-box {
  background: var(--crc-paper);
  border: 2px solid var(--crc-violet);
  border-radius: 18px;
  margin: 0.5rem 1.25rem 2rem;
  padding: 8px;
  box-shadow: 0 5px 0 rgba(106,47,247,0.16), 0 8px 18px rgba(22,207,224,0.14);
}
h2.crc-box-header {
  position: relative;
  font-weight: 700;
  font-size: 1.2rem;
  color: #fff;
  padding: 0.75rem 2.4rem;
  text-align: center;
  border-radius: 12px 12px 0 0;
  background: linear-gradient(90deg, #d11580, var(--crc-violet) 55%, #127d99);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.18);
}
.crc-box-header .crc-hdr-star {
  position: absolute; top: 50%; width: 18px; transform: translateY(-50%);
}
.crc-box-header .crc-hdr-star--l { left: 14px; }
.crc-box-header .crc-hdr-star--r { right: 14px; }
.crc-box-body { padding: 1.85rem; border-radius: 0 0 12px 12px; }

.crc-box--primary {
  border-width: 4px;
  box-shadow: 0 10px 0 rgba(106,47,247,0.3), 0 14px 28px rgba(22,207,224,0.22);
}

/* ---- Form --------------------------------------------------- */
.crc-field { margin-bottom: 1.5rem; }
.crc-field > label { display: block; margin-bottom: 0.5rem; font-weight: 700; color: var(--crc-label); }
.crc-field input[type="text"],
.crc-field input[type="email"],
.crc-field textarea {
  width: 100%;
  padding: 0.6rem 0.7rem;
  border: 2px solid var(--crc-line);
  border-radius: 12px;
  font-size: 1rem;
  font-family: inherit;
  color: var(--crc-ink);
  background: #fffdff;
}
.crc-field input[type="text"]:focus,
.crc-field input[type="email"]:focus,
.crc-field textarea:focus {
  outline: none;
  border-color: var(--crc-cyan);
  box-shadow: 0 0 0 3px rgba(22,207,224,0.25);
}
.crc-field textarea { resize: vertical; min-height: 62px; }
.crc-email { display: flex; align-items: center; gap: 0.5rem; }
.crc-email input { flex: 1; }
.crc-email-suffix { color: var(--crc-link); font-weight: 700; }

.crc-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 0.65rem 0.85rem;
  margin-top: 0.5rem;
}
.crc-option {
  display: flex; align-items: center; gap: 0.55rem;
  background: #fff6fc;
  border: 2px solid var(--crc-line);
  border-radius: 12px;
  padding: 0.45rem 0.6rem;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.crc-option:hover { border-color: var(--crc-cyan); }
.crc-option:has(input:focus-visible) {
  border-color: var(--crc-violet);
  box-shadow: 0 0 0 3px rgba(106,47,247,0.3);
}
.crc-option input[type="checkbox"],
.crc-option input[type="radio"] {
  width: 19px; height: 19px; cursor: pointer;
  accent-color: var(--crc-magenta); flex: 0 0 auto;
}
.crc-option label { margin: 0; font-weight: 500; cursor: pointer; color: var(--crc-ink); }
.crc-option input:checked + label { font-weight: 700; color: var(--crc-link); }
.crc-option:has(input:checked) { border-color: var(--crc-violet); background: #f3edff; }

.crc-inline { display: flex; gap: 1rem; align-items: center; }
.crc-inline > div { flex: 1; }
.crc-inline .crc-sep { color: var(--crc-label); font-weight: 700; }

.crc-required { color: var(--crc-error); }

.crc-actions { display: flex; gap: 1rem; margin-top: 1.6rem; }
.crc-btn-dl {
  position: relative;
  padding: 0.8rem 1.5rem;
  border: none; border-radius: 999px;
  cursor: pointer; font-size: 1.05rem; font-weight: 700;
  font-family: var(--crc-display); color: #fff !important; flex: 1;
  text-align: center; text-decoration: none; display: inline-block;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.18);
  background: linear-gradient(90deg, #127d99, #6a2ff7 60%, #d11580);
  box-shadow: 0 5px 0 rgba(18,125,153,0.4);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.crc-btn-dl:hover { transform: translateY(-1px); color: #fff; text-decoration: none; }
.crc-btn-dl:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(18,125,153,0.4); }
.crc-btn-dl:focus-visible {
  outline: 3px solid #fff; outline-offset: 3px;
  box-shadow: 0 5px 0 rgba(18,125,153,0.4), 0 0 0 5px rgba(18,125,153,0.45);
}
.crc-btn {
  position: relative;
  padding: 0.8rem 1.5rem;
  border: none; border-radius: 999px;
  cursor: pointer; font-size: 1.05rem; font-weight: 700; font-family: var(--crc-display);
  color: #fff; flex: 1;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.18);
  background: linear-gradient(90deg, #d11580, var(--crc-violet) 60%, #127d99);
  box-shadow: 0 5px 0 rgba(106,47,247,0.35);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.crc-btn:hover { transform: translateY(-1px); }
.crc-btn:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
  box-shadow: 0 5px 0 rgba(106,47,247,0.35), 0 0 0 5px rgba(106,47,247,0.45);
}
.crc-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(106,47,247,0.35); }

.crc-alert {
  display: none;
  background: #ffe9f3; color: var(--crc-error);
  border: 2px solid #f5a9cf; padding: 0.7rem 0.9rem;
  border-radius: 12px; margin-top: 1rem; font-weight: 700;
}
.crc-alert.is-visible { display: block; }

/* ---- Link list ---------------------------------------------- */
.crc-link-list { list-style: none; margin: 0; padding: 0; }
.crc-link-list li { margin: 0.25rem 0; font-size: 1.05rem; }
.crc-ext-icon { font-size: 0.8em; vertical-align: super; }

/* ---- Silly sound toggle ------------------------------------ */
.crc-sound-toggle {
  position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.35rem 0.75rem;
  border: 2px solid rgba(255,255,255,0.75); border-radius: 999px; cursor: pointer;
  font-family: var(--crc-display); font-weight: 700; font-size: 0.82rem; color: #fff;
  background: rgba(0,0,0,0.28);
  transition: background 0.2s ease;
}
.crc-sound-toggle:hover { background: rgba(0,0,0,0.45); }
.crc-sound-toggle:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}
.crc-sound-toggle:active { background: rgba(0,0,0,0.55); }
.crc-sound-toggle svg { width: 15px; height: 15px; }
.crc-sound-toggle[aria-pressed="false"] {
  background: rgba(0,0,0,0.5);
  border-color: rgba(255,255,255,0.35);
  color: rgba(255,255,255,0.55);
}

/* hide smaller accents on narrow screens to avoid clutter */
@media (max-width: 980px) {
  .crc-acc--mobile-hide { display: none; }
}

/* ---- Print -------------------------------------------------- */
@media print {
  @page { size: letter; margin: 0.4in; }

  .crc-app { background: #fff; font-size: 9.5pt; line-height: 1.25; }

  .crc-accents,
  .crc-banner,
  .crc-titlebar,
  .crc-actions,
  .crc-sound-toggle,
  .crc-btn-dl,
  .crc-alert,
  .crc-hdr-star,
  #crc-incident-iq { display: none !important; }

  .crc-main { margin: 0; padding: 0; max-width: none; }

  .crc-box {
    box-shadow: none; border: none; margin: 0; padding: 0;
    page-break-inside: avoid;
  }

  .crc-box-header {
    background: none !important; color: #000 !important; text-shadow: none;
    border-bottom: 1.5pt solid #000; text-align: center;
    font-size: 13pt;
    padding: 0 0 0.15rem; margin-bottom: 0.5rem;
  }

  .crc-box-body { padding: 0; }

  .crc-field { margin-bottom: 0.55rem; page-break-inside: avoid; }
  .crc-field > label { color: #000; margin-bottom: 0.2rem; font-size: 9.5pt; }

  .crc-options { gap: 0.15rem 0.6rem; margin-top: 0.15rem; }
  .crc-option { background: #fff; border: none; padding: 0.05rem 0; gap: 0.35rem; }
  .crc-option input[type="checkbox"],
  .crc-option input[type="radio"] { width: 12px; height: 12px; }
  .crc-option input:checked + label { color: #000; }

  .crc-field input[type="text"],
  .crc-field input[type="email"],
  .crc-field textarea {
    border: none;
    border-bottom: 1pt solid #999;
    border-radius: 0;
    background: #fff;
    resize: none;
    padding: 0.15rem 0.1rem;
    font-size: 9.5pt;
  }
  .crc-field textarea { min-height: 34px; }

  .crc-inline { gap: 0.6rem; }

  .crc-required { color: #000; }
}

  html, body { margin: 0; padding: 0; }

  .crc-app {
    min-height: 0 !important;
    height: auto !important;
  }
}
  
</style>
</head>

    <svg class="crc-acc crc-acc--mobile-hide" style="bottom:30%; left:20px; width:18px; color:#ff7a3d;" viewBox="0 0 24 24"><use href="#lf-sparkle"/></svg>
    <svg class="crc-acc crc-acc--twinkle crc-acc--mobile-hide" style="bottom:170px; right:18px; width:22px; color:#ffd23f;" viewBox="0 0 24 24"><use href="#lf-star"/></svg>
    <svg class="crc-acc crc-acc--spin" style="top:40%; left:20px; width:18px; color:#ff2e9a;" viewBox="0 0 24 24"><use href="#lf-sparkle"/></svg>
  </div>
  <!-- ===== Banner (inlined image) ===== -->
  <header class="crc-banner">
    <img class="crc-banner-img" src="assets/d172d13f3f2c.jpg"
         alt="A tie-dye workbench piled with rainbow-skinned Chromebooks mid-repair, their cracked screens showing grinning cartoon faces and slang speech bubbles in a school computer lab.">
  </header>
  <div class="crc-titlebar">
    <h1>Chromebook Repair Center</h1>
    <button id="crc-sound-toggle" class="crc-sound-toggle" type="button" aria-pressed="true" aria-label="Toggle typing sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M16 8c1.6 1.2 1.6 6.8 0 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="crc-sound-label">Sound: On</span>
    </button>
  </div>

  <main class="crc-main">

    <!-- ===== Repair intake form ===== -->
    <section class="crc-box crc-box--primary" aria-labelledby="crc-form-heading">
      <h2 class="crc-box-header" id="crc-form-heading">
        <svg class="crc-hdr-star crc-hdr-star--l" viewBox="0 0 24 24" aria-hidden="true"><use href="#lf-star" fill="#fff"/></svg>
        Repair Form
        <svg class="crc-hdr-star crc-hdr-star--r" viewBox="0 0 24 24" aria-hidden="true"><use href="#lf-star" fill="#fff"/></svg>
      </h2>
      <div class="crc-box-body">
        <form id="crc-repair-form" novalidate>

          <div class="crc-field">
            <label for="crc-student-name">Student Name: <span class="crc-required">*</span></label>
            <input type="text" id="crc-student-name" autocomplete="name">
          </div>

          <div class="crc-field">
            <label for="crc-email-username">WestEx Email: <span class="crc-required">*</span></label>
            <div class="crc-email">
              <input type="text" id="crc-email-username" autocomplete="off">
              <span class="crc-email-suffix">@westex.org</span>
            </div>
          </div>

          <div class="crc-field">
            <label id="crc-problem-label">Problem: <span class="crc-required">*</span></label>
            <div class="crc-options" role="group" aria-labelledby="crc-problem-label">
              <div class="crc-option"><input type="checkbox" id="crc-broken-screen" name="problem" value="Broken Screen"><label for="crc-broken-screen">Broken Screen</label></div>
              <div class="crc-option"><input type="checkbox" id="crc-no-hold-charge" name="problem" value="Doesn't Hold Charge"><label for="crc-no-hold-charge">Doesn't Hold Charge</label></div>
              <div class="crc-option"><input type="checkbox" id="crc-hinge" name="problem" value="Hinge Falling Apart"><label for="crc-hinge">Hinge Falling Apart</label></div>
              <div class="crc-option"><input type="checkbox" id="crc-keyboard" name="problem" value="Keyboard Issue"><label for="crc-keyboard">Keyboard Issue</label></div>
              <div class="crc-option"><input type="checkbox" id="crc-trackpad" name="problem" value="Trackpad/Mouse"><label for="crc-trackpad">Trackpad/Mouse</label></div>
              <div class="crc-option"><input type="checkbox" id="crc-wifi" name="problem" value="Wi-Fi"><label for="crc-wifi">Wi-Fi</label></div>
              <div class="crc-option"><input type="checkbox" id="crc-wont-charge" name="problem" value="Won't Charge"><label for="crc-wont-charge">Won't Charge</label></div>
              <div class="crc-option"><input type="checkbox" id="crc-wont-turn-on" name="problem" value="Won't Turn On"><label for="crc-wont-turn-on">Won't Turn On</label></div>
              <div class="crc-option"><input type="checkbox" id="crc-other" name="problem" value="Other"><label for="crc-other">Other</label></div>
            </div>
            </div>
          </div>

          <div class="crc-field">
            <label for="crc-other-description">If Other, describe:</label>
            <textarea id="crc-other-description" rows="3"></textarea>
          </div>

          <div class="crc-field">
            <label id="crc-damage-label">Visible Damage? <span class="crc-required">*</span></label>
            <div class="crc-options" role="radiogroup" aria-labelledby="crc-damage-label">
              <div class="crc-option"><input type="radio" id="crc-damage-yes" name="damage" value="Yes"><label for="crc-damage-yes">Yes</label></div>
              <div class="crc-option"><input type="radio" id="crc-damage-no" name="damage" value="No"><label for="crc-damage-no">No</label></div>

          <div class="crc-field">

            <input type="text" id="crc-received-by">

              <div><input type="text" id="crc-iq-date" aria-label="Date entered in Incident IQ"></div>

            <a class="crc-btn-dl" href="assets/d21be918b5fd.pdf"
               download="Chromebook_Repair_Intake_Form.pdf">Download Blank Form (PDF)</a>
          </div>

   </main>


</div>

<script>
(function () {
  var alertBox = document.getElementById('crc-alert');
  var printBtn = document.getElementById('crc-print-btn');
  function showAlert(m){ alertBox.textContent = m; alertBox.classList.add('is-visible'); }
  function clearAlert(){ alertBox.textContent = ''; alertBox.classList.remove('is-visible'); }
  function validate(){
    var name = document.getElementById('crc-student-name').value.trim();
    var email = document.getElementById('crc-email-username').value.trim();
    var problems = document.querySelectorAll('input[name="problem"]:checked');
    var damage = document.querySelector('input[name="damage"]:checked');
    if (!name) return 'Please enter the student name.';
    if (!email) return 'Please enter the WestEx email.';
    if (problems.length === 0) return 'Please select at least one problem.';
    if (!damage) return 'Please indicate whether there is visible damage.';
    return '';
  }
  printBtn.addEventListener('click', function(){
    var p = validate();
    if (p){ showAlert(p); return; }
    clearAlert();
    window.print();
  });

  // ---- Silly typing noise (synthesized, no audio files) ----
  var soundOn = true;
  var actx = null;
  var toggle = document.getElementById('crc-sound-toggle');
  var soundLabel = document.getElementById('crc-sound-label');

  function ensureCtx(){
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended'){ actx.resume(); }
    return actx;
  }

  function blip(){
  if (!soundOn) return;
  var ctx = ensureCtx();
  if (!ctx) return;
  var t = ctx.currentTime;

  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  var waves = ['square', 'triangle', 'sawtooth', 'sine'];
  osc.type = waves[(Math.random() * waves.length) | 0];

  // Pick a musical-ish base pitch so random blips don't clash too badly
  var scale = [220, 247, 262, 294, 330, 349, 392, 440, 494, 523, 587, 659];
  var start = scale[(Math.random() * scale.length) | 0];

  // Choose one of several glissando shapes
  var shape = Math.floor(Math.random() * 5);
  var dur = 0.16 + Math.random() * 0.12; // 0.16–0.28s

  switch (shape) {
    case 0: // rising slide
      osc.frequency.setValueAtTime(start * 0.6, t);
      osc.frequency.exponentialRampToValueAtTime(start * 2.2, t + dur);
      break;
    case 1: // falling slide
      osc.frequency.setValueAtTime(start * 2.0, t);
      osc.frequency.exponentialRampToValueAtTime(start * 0.5, t + dur);
      break;
    case 2: // boing (up then down)
      osc.frequency.setValueAtTime(start * 0.7, t);
      osc.frequency.exponentialRampToValueAtTime(start * 2.4, t + dur * 0.35);
      osc.frequency.exponentialRampToValueAtTime(start * 0.45, t + dur);
      break;
    case 3: // whoop (down then up)
      osc.frequency.setValueAtTime(start * 1.6, t);
      osc.frequency.exponentialRampToValueAtTime(start * 0.5, t + dur * 0.4);
      osc.frequency.exponentialRampToValueAtTime(start * 1.9, t + dur);
      break;
    case 4: // long swoop, wider range
      osc.frequency.setValueAtTime(start * 3.0, t);
      osc.frequency.exponentialRampToValueAtTime(start * 0.35, t + dur);
      break;
  }

  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.08, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.02);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

  var skip = { Tab:1, Shift:1, Control:1, Alt:1, Meta:1, CapsLock:1, Escape:1,
               ArrowLeft:1, ArrowRight:1, ArrowUp:1, ArrowDown:1, Home:1, End:1 };
  document.querySelectorAll('.crc-app input[type="text"], .crc-app textarea').forEach(function(el){
    el.addEventListener('keydown', function(e){
      if (skip[e.key]) return;
      if (e.repeat) return; // ignore OS key-repeat from a held key, avoids a flood
      blip();
    });
  });

  if (toggle){
    toggle.addEventListener('click', function(){
      soundOn = !soundOn;
      toggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
      if (soundLabel) soundLabel.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
      if (soundOn){ ensureCtx(); blip(); }
    });
  }
})();
</script>
